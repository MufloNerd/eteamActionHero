<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>E-TEAM: Operazione Sobrietà Zero</title>
    <link rel="stylesheet" href="style.css?v=33">
</head>

<body>
    <canvas id="c"></canvas>
    <div id="hud" hidden>
        <div id="top">
            <button id="objToggle" title="Mostra/nascondi obiettivi"><b id="mtitle"></b><span id="objCount"></span><i>▾</i></button>
            <ul id="objs"></ul>
        </div>
        <div id="toast"></div>
        <div id="alarm" hidden></div>
        <div id="planbar" hidden><span id="planTxt"></span><button id="bGo">▶ Via! (Spazio)</button></div>
        <div id="actions">
            <button id="bAbil" class="tile"></button>
            <button id="bAbil2" class="tile"></button>
            <button id="bAct" class="tile"><span class="ico">✋</span><span class="lbl">Interagisci</span><kbd>E</kbd></button>
            <button id="bMenu" class="tile"><span class="ico">☰</span><span class="lbl">Menu</span></button>
        </div>
        <div id="menu" hidden>
            <button id="bHint">💡 Indizio <kbd>H</kbd></button>
            <button id="bPlan">🎬 Pianifica <kbd>P</kbd></button>
            <button id="bFollow">Segui: NO (F)</button>
            <button id="bMap">🗺 Minimappa</button>
            <button id="bMute">🔊 Audio (M)</button>
            <button id="bSave">💾 Salva <kbd>F5</kbd></button>
            <button id="bLoad">⟲ Carica <kbd>F9</kbd></button>
            <button id="bRestart">↻ Riavvia <kbd>R</kbd></button>
            <button id="bQuit">🏠 Menu principale</button>
        </div>
        <div id="team"></div>
        <canvas id="mini" title="Mappa: clicca per spostare la vista"></canvas>
    </div>
    <div id="screen" class="overlay"></div>
    <script src="data.js?v=33"></script>
    <script src="audio.js?v=33"></script>
    <script src="art.js?v=33"></script>
    <script src="game.js?v=33"></script>
    <script src="systems.js?v=33"></script>
</body>

</html>
